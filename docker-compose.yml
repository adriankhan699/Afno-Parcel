# Development stack: SQL Server + API + Vite dev server (hot reload).
# Usage:  cp .env.example .env   (set MSSQL_SA_PASSWORD)   then   docker compose up --build
name: nepalparcel

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: src/NepalParcel.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=${SQL_DATABASE:-AfnoParcel};User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Database__ApplyMigrationsOnStartup: "true"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env (random 64+ characters, see .env.example)}
      Bootstrap__SuperAdmin__Email: ${BOOTSTRAP_SUPERADMIN_EMAIL:-}
      Bootstrap__SuperAdmin__Password: ${BOOTSTRAP_SUPERADMIN_PASSWORD:-}
      Cors__AllowedOrigins__0: "http://localhost:${WEB_PORT:-5173}"
      Swagger__Enabled: "true"
    ports:
      - "${API_PORT:-5080}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_PROXY_TARGET: http://api:8080
      VITE_APP_NAME: ${VITE_APP_NAME:-Afno Parcel}
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - web-node-modules:/app/node_modules
    depends_on:
      - api

volumes:
  sqlserver-data:
  web-node-modules:
